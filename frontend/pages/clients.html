<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Cyber-Protection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div id="alert-container" class="alert-container"></div>
<div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

<div class="app">

  <header class="topbar">
    <button class="topbar__hamburger" id="hamburger" aria-label="Abrir menú">
      <i class="ti ti-menu-2" aria-hidden="true"></i>
    </button>
    <div class="topbar__logo">
      <div class="topbar__logo-mark"><i class="ti ti-shield-lock" aria-hidden="true"></i></div>
      <span class="topbar__brand">Cyber-Protection</span>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Navegación principal">
    <div class="sidebar__header">
      <div class="sidebar__logo-mark"><i class="ti ti-shield-lock" aria-hidden="true"></i></div>
      <span class="sidebar__brand sidebar__label">CP Sistema</span>
      <button class="sidebar__collapse-btn" id="sidebar-collapse-btn" aria-label="Colapsar sidebar">
        <i class="ti ti-layout-sidebar-left-collapse" id="sidebar-collapse-icon" aria-hidden="true"></i>
      </button>
    </div>
        <div class="sidebar__nav">
      <a href="dashboard.html"     class="sidebar__item" ><i class="ti ti-home" aria-hidden="true"></i><span class="sidebar__label">Dashboard</span></a>
      <a href="clients.html"       class="sidebar__item sidebar__item--active"  aria-current="page"><i class="ti ti-users" aria-hidden="true"></i><span class="sidebar__label">Clientes</span></a>
      <a href="services.html"      class="sidebar__item"  ><i class="ti ti-briefcase" aria-hidden="true"></i><span class="sidebar__label">Servicios</span></a>
      <a href="opportunities.html" class="sidebar__item"  ><i class="ti ti-trending-up" aria-hidden="true"></i><span class="sidebar__label">Oportunidades</span></a>
      <a href="report.html"        class="sidebar__item"  ><i class="ti ti-robot" aria-hidden="true"></i><span class="sidebar__label">Generar informe</span></a>
      <div class="sidebar__divider"></div>
      <a href="import.html"        class="sidebar__item"  ><i class="ti ti-upload" aria-hidden="true"></i><span class="sidebar__label">Importar datos</span></a>
      <a href="ingestion.html"     class="sidebar__item"  ><i class="ti ti-database-import" aria-hidden="true"></i><span class="sidebar__label">Historial</span></a>
    </div>
    <div class="sidebar__user">
      <div class="sidebar__avatar" id="sidebar-initials">??</div>
      <div class="sidebar__user-info sidebar__label">
        <div class="sidebar__username" id="sidebar-username">Cargando...</div>
        <div class="sidebar__role" id="sidebar-role">—</div>
      </div>
    </div>
  </nav>

  <div class="main">
    <header class="main__topbar">
      <span class="main__topbar-title">Clientes</span>
      <div class="main__topbar-actions">
        <button class="topbar__icon-btn" id="logout-btn-desktop" aria-label="Cerrar sesión">
          <i class="ti ti-logout" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main class="main__content">

      <div class="page-header page-enter">
        <div>
          <h1 class="page-header__title">Clientes</h1>
          <p class="page-header__sub"><span id="clients-count">—</span></p>
        </div>
        <div class="page-header__actions">
          <button class="btn btn--primary" onclick="openNewClientModal()">
            <i class="ti ti-plus btn__icon" aria-hidden="true"></i>
            Nuevo cliente
          </button>
        </div>
      </div>

      <div class="card page-enter page-enter--d1">
        <div class="card__header">
          <div class="search" style="flex:1;max-width:320px">
            <i class="ti ti-search search__icon" aria-hidden="true"></i>
            <input type="search" id="client-search" class="search__input" placeholder="Buscar empresa, contacto...">
          </div>
        </div>
        <div class="table-wrapper" style="border:none;border-radius:0">
          <table class="table" aria-label="Lista de clientes">
            <thead>
              <tr>
                <th>Empresa</th>
                <th>Contacto</th>
                <th>Industria</th>
                <th>Teléfono</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="clients-tbody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- MODAL CLIENTE -->
<div class="modal-backdrop" id="client-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title" id="modal-title">Nuevo cliente</h2>
      <button class="modal__close" data-close-modal="client-modal" aria-label="Cerrar">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
    </div>
    <div class="modal__body">
      <form id="client-form" novalidate>
        <div class="form__row form__row--2">
          <div class="form__group">
            <label for="f-company">Empresa <span aria-hidden="true">*</span></label>
            <input type="text" id="f-company" placeholder="Nombre de la empresa" required>
          </div>
          <div class="form__group">
            <label for="f-contact">Contacto <span aria-hidden="true">*</span></label>
            <input type="text" id="f-contact" placeholder="Nombre del contacto" required>
          </div>
        </div>
        <div class="form__row form__row--2">
          <div class="form__group">
            <label for="f-email">Correo <span aria-hidden="true">*</span></label>
            <input type="email" id="f-email" placeholder="correo@empresa.cl" required>
          </div>
          <div class="form__group">
            <label for="f-phone">Teléfono</label>
            <input type="tel" id="f-phone" placeholder="+56 9 ...">
          </div>
        </div>
        <div class="form__group">
          <label for="f-industry">Industria</label>
          <select id="f-industry">
            <option value="">Seleccionar...</option>
            <option>Construcción</option>
            <option>Salud</option>
            <option>Retail</option>
            <option>Finanzas</option>
            <option>Educación</option>
            <option>Tecnología</option>
            <option>Manufactura</option>
            <option>Gobierno</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="form__group">
          <label for="f-notes">Notas</label>
          <textarea id="f-notes" placeholder="Contexto del cliente, oportunidad, observaciones..."></textarea>
        </div>
      </form>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" data-close-modal="client-modal">Cancelar</button>
      <button class="btn btn--primary" id="client-submit" form="client-form" type="submit">
        <i class="ti ti-check btn__icon" aria-hidden="true"></i>
        Guardar
      </button>
    </div>
  </div>
</div>

<script type="module">
  import { initSidebar } from '../js/sidebar.js'
  import { loadUserInfo } from '../js/auth.js'
  import { initProfileModal } from '../js/profile.js'
  import { initClients } from '../js/clients.js'

  loadUserInfo()
  initSidebar()
  initProfileModal()
  initClients()

  document.getElementById('logout-btn-desktop')?.addEventListener('click', () => {
    sessionStorage.removeItem('cp_token')
    window.location.href = '/pages/login.html'
  })
</script>

</body>
</html>
